# ============================================================================
#  FPS Boost - configuration (read once at game start; restart to apply)
# ============================================================================
#  preset=none  -> every value below is used exactly as written.
#  preset=pvp   -> the keys marked [PVP] are overridden with the values listed
#                  in their comment; everything else is still read from here.
#
#  masterEnabled=false switches EVERY optimization off but keeps the
#  diagnostics running. Use it for fair A/B testing on the same install.
# ============================================================================

masterEnabled=true
preset=none

# ---- Particles --------------------------------------------------------------
# Refuse new particles once this many are alive. Vanilla has no useful cap.
# Skipped particles are never constructed, which also saves allocations.
particles.limitEnabled=true
# Max live particles. [PVP: 600]
particles.maxCount=2500
# Percent of newly requested particles that are actually spawned (1-100).
# 100 = off. [PVP: 35]
particles.spawnPercent=100
# Drop particles spawned farther than this many blocks from the camera.
# 0 = off. (Vanilla already drops most particles beyond 32 blocks.) [PVP: 20]
particles.maxDistance=0
# Torch flames, redstone sparks, lava pops, drips, portal/enchant swirls etc.
# false = skip the per-tick scan that spawns them. [PVP: false]
particles.ambientBlockParticles=true

# ---- Entities ---------------------------------------------------------------
# Do not render non-player, non-projectile entities farther than this.
# Players, arrows, pearls, fireworks etc. are never culled by this option.
entities.cullEnabled=true
entities.maxDistance=56
# [PVP: 32] (entities.cullEnabled stays as written above)

# ---- Block entities (chests, signs, banners, spawners, beds, ...) -------------
# Beacons are never culled. Does not touch chunk meshes (Sodium owns those).
blockEntities.cullEnabled=true
blockEntities.maxDistance=48
# [PVP: 24]

# ---- Integrated server (singleplayer only) -------------------------------------
# EXPERIMENTAL / off by default. Lowers the priority of the integrated server
# thread by one step so the render thread wins when both compete for a weak CPU.
# Can make chunk generation slower. Keep only if your own reports show it helps.
server.lowerThreadPriority=false

# ---- Diagnostics (no background thread; one nanoTime() read per frame) ----------
diagnostics.frameRecording=true
# Number of most recent frames kept in memory (long[] - 20000 = 160 KB).
diagnostics.frameBuffer=20000
# GC pause tracking via JVM notifications (counts and durations only).
diagnostics.gcTracking=true
# Also write every frame time to a CSV next to the text report.
diagnostics.writeCsv=true
